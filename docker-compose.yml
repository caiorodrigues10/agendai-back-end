services:
  database:
    image: postgres:16-alpine
    container_name: barberqueue_db
    restart: always
    ports:
      # Host 5442 para não conflitar com outros Postgres locais (5440/5441 etc.)
      - "5442:5432"
    environment:
      POSTGRES_USER: barberqueue
      POSTGRES_PASSWORD: barberqueue123
      POSTGRES_DB: barberqueue_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberqueue -d barberqueue_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: barberqueue_api
    restart: always
    # env_file carrega o .env automaticamente; environment abaixo tem precedência
    env_file:
      - .env
    environment:
      # Sobrescreve DATABASE_URL para apontar para o container interno
      DATABASE_URL: postgresql://barberqueue:barberqueue123@database:5432/barberqueue_db
      NODE_ENV: development
      PORT: "3333"
      ALLOWED_ORIGINS: "http://localhost:3002,http://localhost:5173,http://127.0.0.1:3002,http://127.0.0.1:3003,http://localhost:3003"
      # Dentro do container, a chave GCS fica em /run/secrets/gcs-key.json
      GCS_KEY_FILE_PATH: /run/secrets/gcs-key.json
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
      # gcs-key.json montado como read-only.
      # Execute `bash scripts/ensure-gcs-key.sh` para criar o placeholder
      # caso ainda não tenha a chave real do GCP.
      - ./gcs-key.json:/run/secrets/gcs-key.json:ro
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma db push &&
        npm run prisma:seed &&
        npm run dev:docker
      "

volumes:
  pgdata:
    driver: local
