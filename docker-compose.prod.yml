x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  init: true
  stop_grace_period: 30s

services:
  api:
    <<: *app
    environment:
      NODE_ENV: production
      PROCESS_ROLE: api
      RUN_MIGRATIONS: "true"
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /ready retorna 503 enquanto PostgreSQL ou Redis estiver indisponível.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3333/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      NODE_ENV: production
      PROCESS_ROLE: scheduler
      RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: agendai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: agendai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendai -d agendai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  default:
    name: agendai-network
