version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendai_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescritas para produção
      NODE_ENV: production
      # DATABASE_URL e REDIS_URL vêm do .env
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node dist/shared/infra/http/server.js
      "

  db:
    image: postgres:16-alpine
    container_name: agendai_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: agendai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agendai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendai -d agendai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agendai_redis
    restart: unless-stopped
    env_file:
      - .env
    # REDIS_URL já no .env, mas mantém compatibilidade
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  default:
    name: agendai-network