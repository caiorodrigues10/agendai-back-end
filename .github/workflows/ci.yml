name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and history with Gitleaks
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.24.3
          detect --source=/repo --redact --no-banner --verbose

  backend:
    name: Backend and migration integrity
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agendai
          POSTGRES_PASSWORD: agendai123
          POSTGRES_DB: agendai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agendai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agendai:agendai123@localhost:5432/agendai
      DIRECT_URL: postgresql://agendai:agendai123@localhost:5432/agendai
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-key-that-is-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-key-that-is-at-least-32-chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ASAAS_WEBHOOK_TOKEN: ci-test-webhook-token-that-is-at-least-32-chars
      ALLOW_TEST_REDIS: "1"
      DB_POOL_MAX: "20"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run docs:check
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Detect schema drift after migrations
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - run: npm run typecheck
      - run: npm run test:security
      # Unitários: sem a pasta de integração (mesma convenção de `npm test`).
      - run: npm run test:unit
      # Integração: banco real compartilhado → serial (maxWorkers=1, sem paralelismo
      # de arquivos). Em paralelo os testes brigam pelo mesmo Postgres/Redis e os
      # timeouts de 30s do dataExport + o smoke de /health ficam flaky.
      # O timeout de teste sobe para 60s: o Postgres do runner é lento
      # (checkpoint de ~100s observado em 2026-11-06) e o default de 30s matava
      # transações legítimas com P2028 "Transaction already closed".
      - name: Integration tests (serial)
        run: npx vitest run --maxWorkers=1 --no-file-parallelism --testTimeout=60000 src/tests/integration
