name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and history with Gitleaks
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.24.3
          detect --source=/repo --redact --no-banner --verbose

  backend:
    name: Backend and migration integrity
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agendai:agendai123@localhost:5432/agendai
      DIRECT_URL: postgresql://agendai:agendai123@localhost:5432/agendai
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-key-that-is-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-key-that-is-at-least-32-chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ASAAS_WEBHOOK_TOKEN: ci-test-webhook-token-that-is-at-least-32-chars
      ALLOW_TEST_REDIS: "1"
      DB_POOL_MAX: "20"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # O Postgres sobe como passo (e não como `service`) porque `services` não
      # aceita `command`: o disco do runner é lento (checkpoint de ~99s em
      # 2026-11-06) e a extensão de RLS abre uma transação por query — cada
      # commit com `synchronous_commit=on` espera o fsync do WAL e o export do
      # dataExport estourava o timeout do teste. Banco do CI é descartável:
      # fsync desligado e checkpoint raro.
      - name: Sobe o Postgres (sem fsync)
        run: |
          docker run -d --name agendai-pg \
            -e POSTGRES_USER=agendai \
            -e POSTGRES_PASSWORD=agendai123 \
            -e POSTGRES_DB=agendai \
            -p 5432:5432 \
            postgres:16-alpine \
            postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
              -c checkpoint_timeout=30min -c max_wal_size=2GB \
              -c log_min_duration_statement=1000 -c log_lock_waits=on \
              -c deadlock_timeout=5s -c log_checkpoints=on \
              -c log_autovacuum_min_duration=1000
          for attempt in $(seq 1 60); do
            if docker exec agendai-pg pg_isready -U agendai >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec agendai-pg pg_isready -U agendai
      - run: npm ci
      - run: npm run docs:check
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Detect schema drift after migrations
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - run: npm run typecheck
      - run: npm run test:security
      # Unitários: sem a pasta de integração (mesma convenção de `npm test`).
      - run: npm run test:unit
      # Integração: banco real compartilhado → serial (maxWorkers=1, sem paralelismo
      # de arquivos). Em paralelo os testes brigam pelo mesmo Postgres/Redis e os
      # timeouts de 30s do dataExport + o smoke de /health ficam flaky.
      # O timeout de teste sobe para 60s: o Postgres do runner é lento
      # (checkpoint de ~100s observado em 2026-11-06) e o default de 30s matava
      # transações legítimas com P2028 "Transaction already closed".
      - name: Integration tests (serial)
        run: |
          ( while true; do
              echo "=== $(date -u +%H:%M:%S) ==="
              docker exec agendai-pg psql -U agendai -d agendai -Atc \
                "select pid, state, coalesce(wait_event_type,'-'), coalesce(wait_event,'-'), left(regexp_replace(query, '\s+', ' ', 'g'), 180) from pg_stat_activity where datname='agendai' and state <> 'idle'"
              sleep 5
            done ) > /tmp/pg-sampler.log 2>&1 &
          SAMPLER=$!
          set +e
          npx vitest run --maxWorkers=1 --no-file-parallelism --testTimeout=60000 src/tests/integration
          STATUS=$?
          set -e
          kill $SAMPLER || true
          echo "--- sampler do Postgres ---"
          cat /tmp/pg-sampler.log
          exit $STATUS
      - name: Logs do Postgres (diagnóstico)
        if: always()
        run: docker logs agendai-pg 2>&1 | tail -400
      # DIAGNÓSTICO TEMPORÁRIO: o dataExport estourava 60s no runner. Roda
      # isolado, com timeout alto e relatório verbose, para medir quanto cada
      # teste leva de verdade (roda mesmo com a integração anterior falhando).
      - name: Diagnóstico dataExport
        if: always()
        run: >
          npx vitest run --maxWorkers=1 --no-file-parallelism --testTimeout=45000
          --bail=1 --reporter=verbose
          src/tests/integration/dataExport.integration.spec.ts
